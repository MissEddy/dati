<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, email=no">
<meta name="description" content="民法典现场答题互动：读案例故事，答民法典问题。">
<title>民法典现场答题</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="quiz">
  <div class="qhead" id="qhead">
    <h1 id="title">载入中…</h1>
  </div>

  <!-- 答题 -->
  <div id="quiz-wrap" class="hidden">
    <div id="questions"></div>
    <button class="btn submit" id="submit" disabled>
      <span class="spinner hidden" id="spinner"></span><span id="submit-text">提交答案</span>
    </button>
    <div id="progress" class="muted small" style="text-align:center; margin-top:10px;"></div>
  </div>

  <!-- 答题结果 -->
  <div id="result-wrap" class="hidden">
    <div class="result-head">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-cum" id="result-cum"></div>
    </div>
    <div id="result-list"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const sectionId = params.get('section');
const DEV_KEY = 'quiz_device_id';
const TAG = ['A', 'B', 'C', 'D', 'E', 'F'];
let questions = [];
let selections = {};

function getDeviceId() {
  let id = localStorage.getItem(DEV_KEY);
  if (!id) {
    id = 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(DEV_KEY, id);
  }
  return id;
}

// ---------- 加载：直接进入答题（无需昵称）；已提交过则展示结果 ----------
function load() {
  if (!sectionId) { document.getElementById('title').textContent = '缺少板块参数'; return; }
  Promise.all([
    fetch('/api/questions?section=' + encodeURIComponent(sectionId)).then(r => r.json()),
    fetch('/api/my-result?section=' + encodeURIComponent(sectionId) + '&deviceId=' + encodeURIComponent(getDeviceId()) + '&_=' + Date.now()).then(r => r.json())
  ]).then(([qd, md]) => {
    if (qd.error) { document.getElementById('title').textContent = qd.error; return; }
    document.getElementById('title').textContent = qd.section.title;
    document.title = qd.section.title + ' · 答题';
    questions = qd.questions;
    if (md.submitted) showResults(md.results);
    else showQuiz();
  });
}

function showQuiz() {
  document.getElementById('quiz-wrap').classList.remove('hidden');
  renderQuestions();
  updateSubmit();
}

// ---------- 渲染题目：案例背景 + 问题 + 选项 ----------
function renderQuestions() {
  const box = document.getElementById('questions');
  box.innerHTML = '';
  let lastBg = '';
  questions.forEach((q, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'question';
    const isJudge = q.type === 'judge';
    const opts = (q.options || []).map((o, oi) => {
      const badge = isJudge ? (o === '对' ? '✓' : '✗') : TAG[oi];
      const cls = isJudge ? (o === '对' ? 'opt-ok' : 'opt-no') : '';
      return `<div class="opt ${cls}" data-q="${q.id}" data-val="${o}"><span class="opt-badge">${badge}</span><span class="opt-text">${o}</span></div>`;
    }).join('');
    // 案例背景：同一故事的连续题目只展示一次
    const isNewBg = i === 0 || q.background !== questions[i - 1].background;
    const bgHtml = (q.background && isNewBg)
      ? `<div class="q-bg"><div class="q-bg-label">📖 案例背景</div><div class="q-bg-text">${q.background}</div></div>`
      : '';
    wrap.innerHTML = `
      ${bgHtml}
      <div class="qtext">${q.text}</div>
      <div class="opts ${isJudge ? 'opts-judge' : ''}">${opts}</div>`;
    box.appendChild(wrap);
  });
  box.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.dataset.q, val = el.dataset.val;
      selections[qid] = val;
      box.querySelectorAll(`.opt[data-q="${qid}"]`).forEach(o => o.classList.toggle('sel', o.dataset.val === val));
      updateSubmit();
    });
  });
}

// ---------- 提交控制：全部题目答完才可提交 ----------
function updateSubmit() {
  const answered = questions.filter(q => selections[q.id]).length;
  const total = questions.length;
  const allDone = answered === total;
  document.getElementById('submit').disabled = !allDone;
  document.getElementById('progress').textContent = allDone
    ? '已答 ' + answered + ' / ' + total + ' 题 · 可以提交啦'
    : '已答 ' + answered + ' / ' + total + ' 题 · 全部答完后可提交';
}

function resetButton() {
  document.getElementById('spinner').classList.add('hidden');
  document.getElementById('submit-text').textContent = '提交答案';
  updateSubmit();
}

document.getElementById('submit').addEventListener('click', () => {
  const answers = questions.map(q => ({ questionId: q.id, answer: selections[q.id] }));
  const payload = { section: sectionId, answers, deviceId: getDeviceId() };
  const btn = document.getElementById('submit');
  btn.disabled = true;
  document.getElementById('spinner').classList.remove('hidden');
  document.getElementById('submit-text').textContent = '提交中…';
  fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
    .then(r => r.json())
    .then(d => {
      if (d.ok || d.alreadySubmitted) {
        showResults(d.results || []);
      } else {
        alert(d.error || '提交失败，请重试');
        resetButton();
      }
    })
    .catch(() => { alert('网络错误，请重试'); resetButton(); });
});

// ---------- 展示答题结果 ----------
function showResults(results) {
  document.getElementById('quiz-wrap').classList.add('hidden');
  document.getElementById('result-wrap').classList.remove('hidden');
  const correctCount = results.filter(r => r.correct).length;
  const total = results.length;
  document.getElementById('result-score').textContent = '答对 ' + correctCount + ' / ' + total + ' 题';
  // 得分表情
  const rate = total ? correctCount / total : 0;
  document.getElementById('result-emoji').textContent =
    rate === 1 ? '🏆 满分！' : rate >= 0.8 ? '🎉 太棒了！' : rate >= 0.5 ? '👍 不错哦！' : rate > 0 ? '🌟 继续加油！' : '😅 再接再厉！';
  const list = document.getElementById('result-list');
  list.innerHTML = '';
  results.forEach((r, i) => {
    const q = questions.find(x => x.id === r.questionId);
    const isJudge = q ? q.type === 'judge' : false;
    const div = document.createElement('div');
    div.className = 'q-result' + (r.correct ? ' is-right' : ' is-wrong');
    // 正确的题不再展示"正确答案"，只给错误的题展示
    const rightHtml = r.correct ? '' : `<div class="right">正确答案：<b>${r.correctAnswer}</b></div>`;
    div.innerHTML = `
      <div class="q-result-top">
        <span class="qno">第 ${i + 1} 题 · ${isJudge ? '判断题' : '单选题'}</span>
        <span class="q-icon">${r.correct ? '✅' : '❌'}</span>
      </div>
      <div class="qtext">${q ? q.text : ''}</div>
      <div class="answer-lines">
        <div class="your">你的答案：<b>${r.yourAnswer || '（未作答）'}</b></div>
        ${rightHtml}
      </div>`;
    list.appendChild(div);
  });
  // 该设备累计统计（跨板块）
  fetch('/api/my-stats?deviceId=' + encodeURIComponent(getDeviceId())).then(r => r.json()).then(s => {
    if (s && s.total) {
      const pct = Math.round(s.correct / s.total * 100);
      document.getElementById('result-cum').textContent =
        '累计答题 ' + s.total + ' 道 · 答对 ' + s.correct + ' 道 · 正确率 ' + pct + '%';
    }
  }).catch(() => {});
}

load();
</script>
</body>
</html>
