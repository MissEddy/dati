<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时答题展示</title>
<link rel="stylesheet" href="/screen.css">
</head>
<body>
<div class="screen screen-fixed">
  <div class="head">
    <h1 id="title">实时答题</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <!-- 各题答题情况（单栏全宽，可滚动） -->
  <div class="col" id="questions"></div>

  <div class="live-hint"><span class="dot"></span>实时更新中 · 最后更新 <span id="update-hint">--:--:--</span></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const sectionId = params.get('section');
const fmtTime = (ts) => { const d = new Date(ts); return d.toLocaleTimeString('zh-CN', { hour12: false }); };
const LETTER = ['A', 'B', 'C', 'D', 'E', 'F'];

function render(st) {
  const sec = st.sections.find(s => s.id === sectionId);
  if (!sec) { document.getElementById('title').textContent = '板块不存在'; return; }
  document.getElementById('title').textContent = sec.title;
  document.getElementById('subtitle').textContent = sec.subtitle || '';
  document.title = sec.title + ' · 实时展示';
  document.getElementById('update-hint').textContent = fmtTime(Date.now());

  // 各题答题情况：回答人数、正确率、各选项选择占比、正确答案
  const box = document.getElementById('questions');
  box.innerHTML = '';
  let lastBg = '';
  sec.questions.forEach((q, i) => {
    const optsHtml = (q.options || []).map((o, oi) => {
      const label = q.type === 'judge' ? o.text : LETTER[oi];
      const correct = o.text === q.correctAnswer;
      return `
        <div class="opt-row ${correct ? 'is-correct' : ''}">
          <span class="opt-label">${label}</span>
          <span class="opt-bar"><span class="opt-bar-in" style="width:${o.pct}%"></span></span>
          <span class="opt-pct">${o.pct}%<span class="opt-count">（${o.count}人）</span></span>
        </div>`;
    }).join('');
    // 案例背景：同一故事的连续题目只展示一次
    const bgHtml = (q.background && q.background !== lastBg)
      ? `<div class="q-bg">📖 ${q.background}</div>`
      : '';
    lastBg = q.background || '';
    const div = document.createElement('div');
    div.className = 'q-card';
    div.innerHTML = `
      <div class="q-top">
        <span class="q-no">第 ${i + 1} 题 · ${q.type === 'judge' ? '判断题' : '单选题'}</span>
        <span class="q-meta">👥 回答 ${q.answered} 人 · 🎯 正确率 <b>${q.rate}%</b></span>
      </div>
      ${bgHtml}
      <div class="q-text">${q.text}</div>
      <div class="q-opts">${optsHtml}</div>
      <div class="q-answer">✅ 正确答案：<b>${q.correctAnswer}</b></div>`;
    box.appendChild(div);
  });
}

function tick() {
  fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(render).catch(() => {});
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
