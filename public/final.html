<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题总览</title>
<link rel="stylesheet" href="/screen.css">
</head>
<body>
<div class="screen screen-fixed">
  <div class="head">
    <h1>民法典答题 · 总览</h1>
    <div class="subtitle">前三名 · 实时总排名</div>
  </div>

  <!-- 前三名：颁奖台梯度排布（固定显示） -->
  <div class="podium-step" id="podium"><div class="muted" style="font-size:20px;">等待答题…</div></div>

  <!-- 实时总排名（可滚动） -->
  <h2 class="rank-title">实时总排名</h2>
  <div class="rank-scroll">
    <table class="rank">
      <thead><tr><th>排名</th><th>昵称</th><th>答对题数</th><th>答题总数</th><th>正确率</th><th>参与板块</th></tr></thead>
      <tbody id="rank-body"><tr><td colspan="6" class="muted">等待答题…</td></tr></tbody>
    </table>
  </div>

  <div class="live-hint"><span class="dot"></span>实时更新中 · 最后更新 <span id="update-hint">--:--:--</span></div>
</div>

<div class="toast-box" id="toast-box"></div>

<script>
const fmtTime = (ts) => { const d = new Date(ts); return d.toLocaleTimeString('zh-CN', { hour12: false }); };
const TITLES = { 1: '学法达人', 2: '普法之星', 3: '用法先锋' };
const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };
// HTML 转义（防 XSS：昵称来自用户输入）
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render(st) {
  document.getElementById('update-hint').textContent = fmtTime(Date.now());

  // 前三名：颁奖台梯度排布（左第二 → 中第一 → 右第三，台子高低错落）
  // 榜首易主检测（PK 感）
  const prevTop1 = window._prevTop1 || '';
  const curTop1 = st.users.length ? st.users[0].nickname : '';
  if (prevTop1 && curTop1 && prevTop1 !== curTop1) {
    queueToast('👑 第一名易主！' + curTop1 + ' 登上榜首');
    const c = document.querySelector('.podium-col.col1 .honor-card');
    if (c) c.classList.add('podium-pulse');
  }
  window._prevTop1 = curTop1;

  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  const slots = [
    { rank: 2, cls: 'rank2', col: 'col2' },
    { rank: 1, cls: 'rank1', col: 'col1' },
    { rank: 3, cls: 'rank3', col: 'col3' },
  ];
  slots.forEach(s => {
    const u = st.users.find(x => x.rank === s.rank) || null;
    const stepName = s.rank === 1 ? '第一名' : s.rank === 2 ? '第二名' : '第三名';
    const gapLine = (s.rank === 1 && u && st.users[1])
      ? `<div class="score">答对 ${u.correct} 题 · 领先第 2 名 ${u.correct - st.users[1].correct} 题</div>`
      : `<div class="score">答对 ${u ? u.correct : 0} 题</div>`;
    const card = u
      ? `<div class="honor-card ${s.cls}">
          <div class="medal">${MEDALS[s.rank]}</div>
          <div class="title">${TITLES[s.rank]}</div>
          <div class="name">${esc(u.nickname)}</div>
          ${gapLine}
        </div>`
      : `<div class="honor-card ${s.cls} empty"><div class="name">——</div><div class="score">等待产生</div></div>`;
    const col = document.createElement('div');
    col.className = 'podium-col ' + s.col;
    col.innerHTML = `${card}<div class="step h${s.rank}"><span>${stepName}</span></div>`;
    podium.appendChild(col);
  });

  // 实时总排名（按答对题数降序，并列并列）+ 新提交/变化提示
  const body = document.getElementById('rank-body');
  body.innerHTML = '';
  if (!st.users.length) {
    body.innerHTML = '<tr><td colspan="6" class="muted">暂无答题数据</td></tr>';
    window._prevUsers = {};
    return;
  }
  const prevUsers = window._prevUsers || {};
  const nowUsers = {};
  st.users.forEach(u => {
    nowUsers[u.nickname] = u.correct;
    const rate = u.total ? Math.round(u.correct / u.total * 100) : 0;
    const tr = document.createElement('tr');
    if (u.rank === 1) tr.className = 'gold-row';
    if (!(u.nickname in prevUsers)) tr.classList.add('flash-new');
    tr.innerHTML = `
      <td>${MEDALS[u.rank] ? MEDALS[u.rank] + ' ' : ''}第 ${u.rank} 名</td>
      <td>${esc(u.nickname)}</td>
      <td>${u.correct}</td>
      <td>${u.total}</td>
      <td>${rate}%</td>
      <td>${u.sections}</td>`;
    body.appendChild(tr);
    if (!(u.nickname in prevUsers)) {
      queueToast('🎉 ' + u.nickname + ' 加入答题');
    } else if (prevUsers[u.nickname] < u.correct) {
      queueToast('📈 ' + u.nickname + ' 答完新板块，累计答对 ' + u.correct + ' 题');
    }
  });
  window._prevUsers = nowUsers;
}

function queueToast(msg) {
  const box = document.getElementById('toast-box');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.remove(); }, 3000);
}

function tick() { fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(render).catch(() => {}); }
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
